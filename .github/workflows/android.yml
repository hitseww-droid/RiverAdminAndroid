
name: Build River Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Android project structure
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/riveradmin/app
          mkdir -p app/src/main/res/values

          test -f MainActivity.kt
          test -f AndroidManifest.xml
          test -f strings.xml

          cp MainActivity.kt app/src/main/java/com/riveradmin/app/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml app/src/main/res/values/strings.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.riveradmin.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.riveradmin.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiverAdmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
